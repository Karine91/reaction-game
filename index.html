<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:        #0D0D0F;
      --surface:     #141417;
      --signal:      #7F77DD;
      --go:          #1D9E75;
      --false-start: #D85A30;
      --text-primary:#F0EEF8;
      --text-muted:  #888780;
      --font-ui:     'DM Sans', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--void);
      color: var(--text-primary);
      font-family: var(--font-ui);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Canvas ───────────────────────────────────────────────────── */
    #canvas-container {
      position: fixed; inset: 0; z-index: 0;
    }
    #canvas-container canvas {
      display: block; width: 100% !important; height: 100% !important;
    }

    /* ── Full-screen click zone ───────────────────────────────────── */
    /* Active during waiting + react — the WHOLE screen becomes clickable */
    #click-zone {
      position: fixed; inset: 0; z-index: 5;
      pointer-events: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #click-zone.active { pointer-events: auto; }

    /* Pulsing ring centred on the 3D shape — signals "tap anywhere" */
    #click-ring {
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      border: 2px solid transparent;
      pointer-events: none;
      transition: border-color 0.5s ease;
    }
    #click-zone.show-ring #click-ring {
      border-color: rgba(127,119,221,0.40);
      animation: ring-idle 2.2s ease-in-out infinite;
    }
    #click-zone.react-ring #click-ring {
      border-color: rgba(29,158,117,0.75);
      animation: ring-burst 0.25s cubic-bezier(0.22,1,0.36,1) forwards,
                 ring-go    0.9s ease-in-out 0.25s infinite;
    }
    #click-zone.false-ring #click-ring {
      border-color: rgba(216,90,48,0.65);
      animation: ring-shake 0.4s ease;
    }

    @keyframes ring-idle {
      0%,100% { transform: scale(1);    opacity: 0.65; }
      50%      { transform: scale(1.09); opacity: 1;   }
    }
    @keyframes ring-burst {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1.3); opacity: 1; }
    }
    @keyframes ring-go {
      0%,100% { transform: scale(1.3);  opacity: 1;   }
      50%      { transform: scale(1.45); opacity: 0.75; }
    }
    @keyframes ring-shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-10px); }
      75%      { transform: translateX(10px); }
    }

    /* "Tap anywhere" label — floats below the ring */
    #tap-anywhere {
      position: absolute;
      top: calc(50% + 115px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(136,135,128,0.0);
      white-space: nowrap;
      pointer-events: none;
      transition: color 0.5s ease;
    }
    #click-zone.active #tap-anywhere {
      color: rgba(136,135,128,0.55);
    }
    #click-zone.react-ring #tap-anywhere {
      color: rgba(29,158,117,0.8);
    }

    /* ── UI Layer ─────────────────────────────────────────────────── */
    #ui-layer {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Game Panel ───────────────────────────────────────────────── */
    #game-panel {
      pointer-events: auto;
      background: rgba(13,13,15,0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(240,238,248,0.09);
      border-radius: 24px;
      padding: 40px 36px 36px;
      width: min(420px, calc(100vw - 32px));
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.4s ease, border-color 0.4s ease;
      animation: panel-in 0.55s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* During waiting/react the panel steps back — click-zone takes over */
    #game-panel.state-waiting,
    #game-panel.state-react {
      pointer-events: none;
      background: rgba(13,13,15,0.40);
    }
    #game-panel.state-react {
      background: rgba(13,13,15,0.18);
      border-color: rgba(29,158,117,0.22);
    }
    #game-panel.state-false-start {
      border-color: rgba(216,90,48,0.45);
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* ── Round pips ───────────────────────────────────────────────── */
    #round-track {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .pip {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(240,238,248,0.13);
      transition: background 0.35s ease, transform 0.35s ease;
    }
    .pip.done   { background: var(--signal); }
    .pip.active { background: var(--go); transform: scale(1.45); }

    /* ── State label ──────────────────────────────────────────────── */
    #state-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      min-height: 14px;
    }

    /* ── Main heading ─────────────────────────────────────────────── */
    #main-heading {
      font-size: clamp(26px, 5.5vw, 44px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }
    #main-heading.mono {
      font-family: var(--font-mono);
      font-size: clamp(38px, 9vw, 68px);
      letter-spacing: -0.04em;
    }

    /* ── Sub text ─────────────────────────────────────────────────── */
    #sub-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      min-height: 20px;
      margin-bottom: 22px;
    }

    /* ── Instructions ─────────────────────────────────────────────── */
    #instructions {
      display: none;
      flex-direction: column;
      gap: 11px;
      text-align: left;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(240,238,248,0.07);
      border-radius: 14px;
      padding: 18px 18px;
      margin-bottom: 22px;
    }
    #instructions.visible { display: flex; }

    .instr-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .instr-num {
      flex-shrink: 0;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(127,119,221,0.18);
      color: var(--signal);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .instr-text strong { color: var(--text-primary); font-weight: 500; }

    /* ── CTA Button ───────────────────────────────────────────────── */
    #cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      min-height: 50px;
      padding: 14px 36px;
      border-radius: 100px;
      border: none;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #cta-btn:hover  { transform: scale(1.05); }
    #cta-btn:active { transform: scale(0.97); }
    #cta-btn.hidden { display: none; }
    #cta-btn.variant-start {
      background: var(--signal);
      color: #fff;
      box-shadow: 0 0 28px rgba(127,119,221,0.38);
    }
    #cta-btn.variant-start:hover { box-shadow: 0 0 40px rgba(127,119,221,0.55); }
    #cta-btn.variant-again {
      background: var(--go);
      color: #fff;
      box-shadow: 0 0 24px rgba(29,158,117,0.35);
    }

    /* ── Result badge ─────────────────────────────────────────────── */
    #result-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 4px 14px;
      border-radius: 100px;
      background: rgba(29,158,117,0.13);
      color: var(--go);
      margin-bottom: 16px;
      min-height: 22px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #result-badge.visible { opacity: 1; }

    /* ── Summary ──────────────────────────────────────────────────── */
    #summary-block { display: none; text-align: left; margin-bottom: 22px; }
    #summary-block.visible { display: block; }

    .summary-stat {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid rgba(240,238,248,0.06);
    }
    .summary-stat .label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; }
    .summary-stat .value { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
    .summary-stat .value.highlight { color: var(--go); }

    #round-history { margin-top: 14px; }
    .history-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; font-size: 13px;
    }
    .history-row .r-label { color: var(--text-muted); }
    .history-row .r-val   { font-family: var(--font-mono); }

    #rating-chip {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 100px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .chip-lightning { background: rgba(29,158,117,0.17);  color: #5DCAA5; }
    .chip-sharp     { background: rgba(127,119,221,0.17); color: #AFA9EC; }
    .chip-average   { background: rgba(240,238,248,0.07); color: var(--text-muted); }
    .chip-sluggish  { background: rgba(216,90,48,0.13);  color: #F0997B; }

    /* ── Keyboard hint ────────────────────────────────────────────── */
    #kb-hint {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; color: rgba(136,135,128,0.38);
      letter-spacing: 0.08em;
      pointer-events: none; z-index: 10; white-space: nowrap;
    }
    @media (pointer: coarse) { #kb-hint { display: none; } }

    /* ── Shake ────────────────────────────────────────────────────── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-9px); }
      40%      { transform: translateX(9px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Full-screen tap target for waiting + react states -->
<div id="click-zone">
  <div id="click-ring"></div>
  <div id="tap-anywhere">Tap anywhere to react</div>
</div>

<div id="ui-layer">
  <div id="game-panel">
    <div id="round-track"></div>
    <div id="result-badge"></div>
    <div id="state-label">Reaction Timer</div>
    <div id="main-heading">React.</div>
    <div id="sub-text">Test your reflexes in 5 rounds.</div>
    <div id="instructions"></div>
    <div id="summary-block"></div>
    <button id="cta-btn" class="variant-start" aria-label="Start game">Start</button>
  </div>
</div>

<div id="kb-hint">Press <kbd>Space</kbd> to react</div>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════════
   1. CONSTANTS
═══════════════════════════════════════════════════════════════════ */
const TOTAL_ROUNDS    = 5;
const MIN_DELAY       = 1500;
const MAX_DELAY       = 4000;
const PARTICLE_COUNT  = 480;
const BURST_SPEED     = 0.07;
const DRIFT_SPEED     = 0.0035;
const LERP_FACTOR     = 0.05;

const ROT_IDLE        = 0.0035;
const ROT_WAITING     = 0.0018;
const ROT_REACT       = 0.016;
const ROT_RESULT      = 0.007;
const ROT_FALSE_START = 0.022;
const ROT_SUMMARY     = 0.0025;

const RATING_LIGHTNING = 200;
const RATING_SHARP     = 300;
const RATING_AVERAGE   = 450;

// State color targets
const STATE_COLORS = {
  idle:          { mesh:'#7F77DD', particle:'#534AB7', light:'#7F77DD', light2:'#3C3489' },
  waiting:       { mesh:'#534AB7', particle:'#3C3489', light:'#AFA9EC', light2:'#7F77DD' },
  react:         { mesh:'#1D9E75', particle:'#5DCAA5', light:'#1D9E75', light2:'#0F6E56' },
  result:        { mesh:'#1D9E75', particle:'#9FE1CB', light:'#0F6E56', light2:'#1D9E75' },
  'false-start': { mesh:'#D85A30', particle:'#F0997B', light:'#D85A30', light2:'#8A2D0F' },
  summary:       { mesh:'#7F77DD', particle:'#AFA9EC', light:'#534AB7', light2:'#7F77DD' },
};

/* ═══════════════════════════════════════════════════════════════════
   2. THREE.JS SETUP
═══════════════════════════════════════════════════════════════════ */
const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0D0D0F, 1);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 6.5);

// ── Lights ──────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.16);
scene.add(ambientLight);

// Primary orbiting key light — sculpts the surfaces dramatically
const keyLight = new THREE.PointLight(0x7F77DD, 6, 25);
scene.add(keyLight);

// Secondary fill from below for depth and colour richness
const fillLight = new THREE.PointLight(0x3C3489, 3, 18);
fillLight.position.set(0, -3.8, 1.5);
scene.add(fillLight);

/* ═══════════════════════════════════════════════════════════════════
   3. CENTRAL GEOMETRY — Torus Knot (3,2)
   A trefoil-like torus knot: mathematically elegant, continuously
   interesting from every angle as it rotates. Far more dynamic than
   a simple polyhedron. p=3, q=2 is the classic "overhand knot" form.
═══════════════════════════════════════════════════════════════════ */
const knotGeo = new THREE.TorusKnotGeometry(0.88, 0.30, 160, 20, 3, 2);
const knotMat = new THREE.MeshStandardMaterial({
  color:     0x7F77DD,
  roughness: 0.10,
  metalness: 0.85,
});
const knotMesh = new THREE.Mesh(knotGeo, knotMat);
scene.add(knotMesh);

/* ── Outer wireframe icosahedron shell ────────────────────────── */
// Counter-rotates against the knot, creating a parallax cage effect.
// Semi-transparent so the knot shows through.
const icoGeo  = new THREE.IcosahedronGeometry(2.05, 1);
const icoMat  = new THREE.MeshBasicMaterial({
  color: 0x7F77DD, wireframe: true, transparent: true, opacity: 0.10,
});
const icoShell = new THREE.Mesh(icoGeo, icoMat);
scene.add(icoShell);

/* ── Ring of orbiting octahedra ───────────────────────────────── */
// 6 small octahedra on a tilted orbit add spatial depth and motion
// without cluttering the central focus shape.
const ORBIT_COUNT  = 6;
const orbitGroup   = new THREE.Group();
scene.add(orbitGroup);
orbitGroup.rotation.x = 0.42;
orbitGroup.rotation.z = 0.18;

const octaMeshes = [];
const octaMats   = [];

for (let i = 0; i < ORBIT_COUNT; i++) {
  const g = new THREE.OctahedronGeometry(0.15, 0);
  const m = new THREE.MeshStandardMaterial({
    color: 0xAFA9EC, roughness: 0.15, metalness: 0.90,
    transparent: true, opacity: 0.80,
  });
  const mesh = new THREE.Mesh(g, m);
  const angle = (i / ORBIT_COUNT) * Math.PI * 2;
  mesh.position.set(Math.cos(angle) * 2.4, Math.sin(angle) * 0.45, Math.sin(angle) * 2.1);
  orbitGroup.add(mesh);
  octaMeshes.push(mesh);
  octaMats.push(m);
}

/* ═══════════════════════════════════════════════════════════════════
   4. PARTICLE SYSTEM
═══════════════════════════════════════════════════════════════════ */
const positions     = new Float32Array(PARTICLE_COUNT * 3);
const velocities    = new Float32Array(PARTICLE_COUNT * 3);
const basePositions = new Float32Array(PARTICLE_COUNT * 3);
const pColors       = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const r     = 2.1 + Math.random() * 2.8;
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta);
  const z = r * Math.cos(phi);
  positions[i*3] = basePositions[i*3] = x;
  positions[i*3+1] = basePositions[i*3+1] = y;
  positions[i*3+2] = basePositions[i*3+2] = z;
  pColors[i*3]=0.33; pColors[i*3+1]=0.29; pColors[i*3+2]=0.72;
}

const partGeo = new THREE.BufferGeometry();
partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
partGeo.setAttribute('color',    new THREE.BufferAttribute(pColors, 3));

const partMat = new THREE.PointsMaterial({
  size: 0.038, vertexColors: true, transparent: true, opacity: 0.68,
  sizeAttenuation: true, depthWrite: false,
});
const particleSystem = new THREE.Points(partGeo, partMat);
scene.add(particleSystem);

/* ═══════════════════════════════════════════════════════════════════
   5. SCENE STATE TARGET
═══════════════════════════════════════════════════════════════════ */
let sceneTarget = {
  meshColor:    new THREE.Color(0x7F77DD),
  partColor:    new THREE.Color(0x534AB7),
  lightColor:   new THREE.Color(0x7F77DD),
  light2Color:  new THREE.Color(0x3C3489),
  rotSpeed:     ROT_IDLE,
  knotScale:    1.0,
  shellOpacity: 0.10,
  partMode:     'idle',
};

const _pColorWork  = new THREE.Color(0x534AB7);
let burstProgress  = 0;
let burstActive    = false;
let currentScale   = 1.0;

/* ═══════════════════════════════════════════════════════════════════
   6. updateScene(state) — called by state machine only
═══════════════════════════════════════════════════════════════════ */
function updateScene(state) {
  const c = STATE_COLORS[state];
  sceneTarget.meshColor.set(c.mesh);
  sceneTarget.partColor.set(c.particle);
  sceneTarget.lightColor.set(c.light);
  sceneTarget.light2Color.set(c.light2);

  switch (state) {
    case 'idle':
      sceneTarget.rotSpeed    = ROT_IDLE;
      sceneTarget.knotScale   = 1.0;
      sceneTarget.shellOpacity= 0.10;
      sceneTarget.partMode    = 'idle';
      break;
    case 'waiting':
      sceneTarget.rotSpeed    = ROT_WAITING;
      sceneTarget.knotScale   = 0.90;
      sceneTarget.shellOpacity= 0.06;
      sceneTarget.partMode    = 'idle';
      break;
    case 'react':
      sceneTarget.rotSpeed    = ROT_REACT;
      sceneTarget.knotScale   = 1.24;
      sceneTarget.shellOpacity= 0.25;
      sceneTarget.partMode    = 'burst';
      burstActive = true; burstProgress = 0;
      break;
    case 'result':
      sceneTarget.rotSpeed    = ROT_RESULT;
      sceneTarget.knotScale   = 1.0;
      sceneTarget.shellOpacity= 0.13;
      sceneTarget.partMode    = 'settle';
      break;
    case 'false-start':
      sceneTarget.rotSpeed    = ROT_FALSE_START;
      sceneTarget.knotScale   = 0.80;
      sceneTarget.shellOpacity= 0.07;
      sceneTarget.partMode    = 'scatter';
      burstActive = true; burstProgress = 0;
      break;
    case 'summary':
      sceneTarget.rotSpeed    = ROT_SUMMARY;
      sceneTarget.knotScale   = 0.76;
      sceneTarget.shellOpacity= 0.05;
      sceneTarget.partMode    = 'drift';
      break;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   7. animate() — RAF loop; reads state, never sets game state
═══════════════════════════════════════════════════════════════════ */
let lightAngle = 0;

function animate() {
  requestAnimationFrame(animate);

  const t = LERP_FACTOR;

  // ── Torus knot rotation — all 3 axes for constant visual interest ──
  knotMesh.rotation.x += sceneTarget.rotSpeed;
  knotMesh.rotation.y += sceneTarget.rotSpeed * 0.65;
  knotMesh.rotation.z += sceneTarget.rotSpeed * 0.40;

  // ── Knot scale lerp ───────────────────────────────────────────
  currentScale += (sceneTarget.knotScale - currentScale) * 0.075;
  knotMesh.scale.setScalar(currentScale);

  // ── Wireframe shell counter-rotates: parallax cage depth ──────
  icoShell.rotation.x -= 0.0007;
  icoShell.rotation.y -= 0.0011;
  icoMat.opacity += (sceneTarget.shellOpacity - icoMat.opacity) * t;

  // ── Orbiting octahedra ────────────────────────────────────────
  orbitGroup.rotation.y += sceneTarget.rotSpeed * 0.55;
  octaMeshes.forEach((m, i) => {
    m.rotation.x += 0.018 + i * 0.003;
    m.rotation.z += 0.013;
    octaMats[i].color.lerp(sceneTarget.meshColor, t * 0.55);
  });

  // ── Colour lerps ──────────────────────────────────────────────
  knotMat.color.lerp(sceneTarget.meshColor, t);
  icoMat.color.lerp(sceneTarget.meshColor, t * 0.45);

  // ── Light orbit ───────────────────────────────────────────────
  lightAngle += 0.009;
  keyLight.position.set(
    Math.cos(lightAngle) * 4.2,
    Math.sin(lightAngle * 0.65) * 2.2,
    Math.sin(lightAngle) * 4.2
  );
  keyLight.color.lerp(sceneTarget.lightColor, t);
  fillLight.color.lerp(sceneTarget.light2Color, t);

  // ── Particle colour lerp ──────────────────────────────────────
  _pColorWork.lerp(sceneTarget.partColor, t);
  const pr = _pColorWork.r, pg = _pColorWork.g, pb = _pColorWork.b;
  const colAttr = partGeo.attributes.color;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    colAttr.array[i*3]   += (pr - colAttr.array[i*3])   * t;
    colAttr.array[i*3+1] += (pg - colAttr.array[i*3+1]) * t;
    colAttr.array[i*3+2] += (pb - colAttr.array[i*3+2]) * t;
  }
  colAttr.needsUpdate = true;

  // ── Particle positions ────────────────────────────────────────
  const posAttr = partGeo.attributes.position;

  if (sceneTarget.partMode === 'idle') {
    const now = performance.now() * 0.0004;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const bx = basePositions[i*3], by = basePositions[i*3+1], bz = basePositions[i*3+2];
      posAttr.array[i*3]   = bx + Math.sin(now + i*0.43) * 0.048;
      posAttr.array[i*3+1] = by + Math.cos(now + i*0.57) * 0.048;
      posAttr.array[i*3+2] = bz + Math.sin(now + i*0.39) * 0.048;
    }
  }
  else if (sceneTarget.partMode === 'burst' && burstActive) {
    burstProgress += BURST_SPEED;
    if (burstProgress >= 1) { burstProgress = 1; burstActive = false; }
    const ease = 1 - Math.pow(1 - burstProgress, 3); // cubic ease-out
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const bx = basePositions[i*3], by = basePositions[i*3+1], bz = basePositions[i*3+2];
      const len = Math.sqrt(bx*bx + by*by + bz*bz) || 1;
      posAttr.array[i*3]   = bx + (bx/len) * ease * 3.0;
      posAttr.array[i*3+1] = by + (by/len) * ease * 3.0;
      posAttr.array[i*3+2] = bz + (bz/len) * ease * 3.0;
    }
  }
  else if (sceneTarget.partMode === 'settle') {
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      posAttr.array[i*3]   += (basePositions[i*3]   - posAttr.array[i*3])   * 0.048;
      posAttr.array[i*3+1] += (basePositions[i*3+1] - posAttr.array[i*3+1]) * 0.048;
      posAttr.array[i*3+2] += (basePositions[i*3+2] - posAttr.array[i*3+2]) * 0.048;
    }
  }
  else if (sceneTarget.partMode === 'scatter' && burstActive) {
    burstProgress += BURST_SPEED * 1.4;
    if (burstProgress >= 1) { burstProgress = 1; burstActive = false; }
    const ease = 1 - Math.pow(1 - burstProgress, 2);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const bx = basePositions[i*3], by = basePositions[i*3+1], bz = basePositions[i*3+2];
      if (burstProgress < 0.03) {
        velocities[i*3]   = (Math.random()-0.5)*5.5;
        velocities[i*3+1] = (Math.random()-0.5)*5.5;
        velocities[i*3+2] = (Math.random()-0.5)*5.5;
      }
      posAttr.array[i*3]   = bx + velocities[i*3]   * ease;
      posAttr.array[i*3+1] = by + velocities[i*3+1] * ease;
      posAttr.array[i*3+2] = bz + velocities[i*3+2] * ease;
    }
  }
  else if (sceneTarget.partMode === 'drift') {
    const now = performance.now() * 0.0003;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      posAttr.array[i*3]   += Math.sin(now + i*0.31) * 0.003;
      posAttr.array[i*3+1] += DRIFT_SPEED;
      if (posAttr.array[i*3+1] > 6.5) posAttr.array[i*3+1] = -6.5;
      posAttr.array[i*3+2] += Math.cos(now + i*0.44) * 0.002;
    }
  }

  posAttr.needsUpdate = true;
  particleSystem.rotation.y += 0.0012;

  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════════════
   8. GAME STATE
═══════════════════════════════════════════════════════════════════ */
let gameState = {
  phase:       'idle',
  round:       0,
  results:     [],
  reactStart:  0,
  waitTimeout: null,
  lastResult:  null,
};

/* ═══════════════════════════════════════════════════════════════════
   9. STATE MACHINE — setState drives everything
═══════════════════════════════════════════════════════════════════ */
const clickZone = document.getElementById('click-zone');

function updateClickZone(phase) {
  clickZone.className = '';
  if (phase === 'waiting') {
    clickZone.classList.add('active', 'show-ring');
  } else if (phase === 'react') {
    clickZone.classList.add('active', 'react-ring');
  } else if (phase === 'false-start') {
    clickZone.classList.add('false-ring');
  }
}

function setState(newPhase, data = {}) {
  if (gameState.waitTimeout) {
    clearTimeout(gameState.waitTimeout);
    gameState.waitTimeout = null;
  }
  gameState.phase = newPhase;
  Object.assign(gameState, data);
  updateScene(newPhase);
  updateClickZone(newPhase);
  render();

  if (newPhase === 'result') {
    setTimeout(() => {
      if (gameState.results.length >= TOTAL_ROUNDS) {
        setState('summary');
      } else {
        setState('waiting');
        scheduleReact();
      }
    }, 1300);
  }
  else if (newPhase === 'false-start') {
    setTimeout(() => {
      if (gameState.round <= TOTAL_ROUNDS) {
        setState('waiting');
        scheduleReact();
      }
    }, 1600);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   10. TIMING FUNCTIONS
═══════════════════════════════════════════════════════════════════ */
function scheduleReact() {
  const delay = MIN_DELAY + (MAX_DELAY - MIN_DELAY) * Math.random();
  gameState.waitTimeout = setTimeout(() => {
    gameState.reactStart = performance.now();
    setState('react');
  }, delay);
}

function startGame() {
  gameState.round      = 1;
  gameState.results    = [];
  gameState.lastResult = null;
  setState('waiting');
  scheduleReact();
}

function handleClick() {
  const p = gameState.phase;
  if      (p === 'idle' || p === 'summary') { startGame(); }
  else if (p === 'waiting')  { setState('false-start'); }
  else if (p === 'react') {
    const elapsed = Math.round(performance.now() - gameState.reactStart);
    gameState.results.push(elapsed);
    gameState.round++;
    setState('result', { lastResult: elapsed });
  }
  // result / false-start auto-advance; ignore extra clicks
}

/* ═══════════════════════════════════════════════════════════════════
   11. UI RENDERING — reads game state, updates DOM only
═══════════════════════════════════════════════════════════════════ */
const panel        = document.getElementById('game-panel');
const roundTrack   = document.getElementById('round-track');
const stateLabel   = document.getElementById('state-label');
const mainHeading  = document.getElementById('main-heading');
const subText      = document.getElementById('sub-text');
const instructions = document.getElementById('instructions');
const summaryBlock = document.getElementById('summary-block');
const ctaBtn       = document.getElementById('cta-btn');
const resultBadge  = document.getElementById('result-badge');

function buildRoundTrack() {
  roundTrack.innerHTML = '';
  for (let i = 1; i <= TOTAL_ROUNDS; i++) {
    const pip = document.createElement('div');
    pip.className = 'pip';
    const isDone   = i < gameState.round && gameState.phase !== 'idle' && gameState.phase !== 'summary';
    const isActive = i === gameState.round && gameState.phase === 'react';
    if (isDone)   pip.classList.add('done');
    if (isActive) pip.classList.add('active');
    roundTrack.appendChild(pip);
  }
}

function getRating(avg) {
  if (avg < RATING_LIGHTNING) return { label: 'Lightning', cls: 'chip-lightning' };
  if (avg < RATING_SHARP)     return { label: 'Sharp',     cls: 'chip-sharp'     };
  if (avg < RATING_AVERAGE)   return { label: 'Average',   cls: 'chip-average'   };
  return                             { label: 'Sluggish',   cls: 'chip-sluggish'  };
}

function render() {
  const p = gameState.phase;
  panel.className = `state-${p}`;
  buildRoundTrack();

  // Result badge
  if (p === 'result' && gameState.lastResult != null) {
    resultBadge.textContent = `Round ${gameState.results.length} · ${gameState.lastResult} ms`;
    resultBadge.classList.add('visible');
  } else {
    resultBadge.classList.remove('visible');
  }

  instructions.innerHTML = '';
  instructions.classList.remove('visible');
  summaryBlock.classList.remove('visible');
  summaryBlock.innerHTML = '';

  switch (p) {

    case 'idle':
      stateLabel.textContent  = 'Reaction Timer';
      mainHeading.textContent = 'React.';
      mainHeading.className   = '';
      mainHeading.style.color = '';
      subText.textContent     = 'How fast are your reflexes?';

      instructions.classList.add('visible');
      instructions.innerHTML = `
        <div class="instr-row">
          <div class="instr-num">1</div>
          <div class="instr-text">
            Press <strong>Start</strong>. A random delay of 1.5–4 seconds begins.
          </div>
        </div>
        <div class="instr-row">
          <div class="instr-num">2</div>
          <div class="instr-text">
            When it flashes <strong>teal</strong> and shows <strong>GO!</strong> — click, tap, or hit <strong>Space</strong> as fast as possible.
          </div>
        </div>
        <div class="instr-row">
          <div class="instr-num">3</div>
          <div class="instr-text">
            <strong>Don't click early</strong> — clicking before GO is a false start, and the round restarts.
          </div>
        </div>
        <div class="instr-row">
          <div class="instr-num">4</div>
          <div class="instr-text">
            5 rounds total. See your average, best, and rating at the end.
          </div>
        </div>
      `;

      ctaBtn.className   = 'variant-start';
      ctaBtn.textContent = 'Start';
      break;

    case 'waiting':
      stateLabel.textContent  = `Round ${gameState.round} of ${TOTAL_ROUNDS}`;
      mainHeading.textContent = 'Get ready…';
      mainHeading.className   = '';
      mainHeading.style.color = '';
      subText.textContent     = 'Watch for GO — click anywhere.';
      ctaBtn.className        = 'hidden';
      break;

    case 'react':
      stateLabel.textContent  = `Round ${gameState.round} of ${TOTAL_ROUNDS}`;
      mainHeading.textContent = 'GO!';
      mainHeading.className   = '';
      mainHeading.style.color = 'var(--go)';
      subText.textContent     = 'Tap anywhere now!';
      ctaBtn.className        = 'hidden';
      break;

    case 'result': {
      const ms = gameState.lastResult;
      stateLabel.textContent  = `Round ${gameState.results.length} complete`;
      mainHeading.textContent = `${ms} ms`;
      mainHeading.className   = 'mono';
      mainHeading.style.color = '';
      subText.textContent     = ms < RATING_LIGHTNING ? '⚡ Incredible reflexes!'
                              : ms < RATING_SHARP     ? '✓ Sharp!'
                              : ms < RATING_AVERAGE   ? 'Decent — keep going.'
                              : 'Bit slow. Try again!';
      ctaBtn.className        = 'hidden';
      break;
    }

    case 'false-start':
      stateLabel.textContent  = `Round ${gameState.round} of ${TOTAL_ROUNDS}`;
      mainHeading.textContent = 'Too early!';
      mainHeading.className   = '';
      mainHeading.style.color = 'var(--false-start)';
      subText.textContent     = 'Wait for GO — round will restart.';
      ctaBtn.className        = 'hidden';
      panel.classList.remove('shake');
      void panel.offsetWidth; // force reflow to restart animation
      panel.classList.add('shake');
      break;

    case 'summary': {
      const res   = gameState.results;
      const avg   = Math.round(res.reduce((a,b)=>a+b,0) / res.length);
      const best  = Math.min(...res);
      const worst = Math.max(...res);
      const { label, cls } = getRating(avg);

      stateLabel.textContent  = 'Session complete';
      mainHeading.textContent = 'Results';
      mainHeading.className   = '';
      mainHeading.style.color = '';
      subText.textContent     = '';

      summaryBlock.classList.add('visible');
      summaryBlock.innerHTML = `
        <div id="rating-chip" class="${cls}">${label}</div>
        <div class="summary-stat">
          <span class="label">AVERAGE</span>
          <span class="value highlight">${avg} ms</span>
        </div>
        <div class="summary-stat">
          <span class="label">BEST</span>
          <span class="value">${best} ms</span>
        </div>
        <div class="summary-stat">
          <span class="label">WORST</span>
          <span class="value">${worst} ms</span>
        </div>
        <div id="round-history">
          ${res.map((ms,i)=>`
            <div class="history-row">
              <span class="r-label">Round ${i+1}</span>
              <span class="r-val">${ms} ms</span>
            </div>`).join('')}
        </div>
      `;
      ctaBtn.className   = 'variant-again';
      ctaBtn.textContent = 'Play again';
      break;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════
   12. EVENT LISTENERS — call state machine only
═══════════════════════════════════════════════════════════════════ */
// Panel: handles idle + summary (has Start / Play again button)
panel.addEventListener('click', (e) => { e.stopPropagation(); handleClick(); });
ctaBtn.addEventListener('click', (e) => { e.stopPropagation(); handleClick(); });

// Full-screen zone: handles waiting + react states
clickZone.addEventListener('click', () => { handleClick(); });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    handleClick();
  }
});

// Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

/* ═══════════════════════════════════════════════════════════════════
   13. INIT
═══════════════════════════════════════════════════════════════════ */
function init() {
  updateScene('idle');
  updateClickZone('idle');
  render();
  animate();
}

init();
</script>
</body>
